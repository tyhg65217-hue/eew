    // ✅ 一進來就初始化（不依賴 EEW）

        document.getElementById("status").textContent = "🟢 連線成功";

      } catch (e) {
        document.getElementById("status").textContent = "🔴 連線失敗（不影響通知）";
      }
    }

    loadEEW();
    setInterval(loadEEW, 15000);

<body>
<div class="container">
  <h1>📡 EEW 地震速報觀測</h1>
  <div class="status" id="status">● 連線中...</div>

  <div class="card">
    <div class="row"><span>震央</span><span id="loc">--</span></div>
    <div class="row"><span>規模</span><span id="mag">--</span></div>
    <div class="row"><span>深度</span><span id="depth">-- km</span></div>
    <div class="row"><span>最大震度</span><span id="intensity">--</span></div>
    <div class="row"><span>發生時間</span><span id="time">--</span></div>
  </div>

  <button onclick="enableNotification()">🔔 啟用地震通知</button>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>

<script>
/* ================= Firebase ================= */

const firebaseConfig = {
  apiKey: "AIzaSyBV5TFoIf8qbtityDLYgY4qaBBKsFfBKvg",
  authDomain: "eew6409-b5489.firebaseapp.com",
  projectId: "eew6409-b5489",
  messagingSenderId: "53785154936",
  appId: "1:53785154936:web:6520b2504804f2fed5a48d"
};

firebase.initializeApp(firebaseConfig);
const messaging = firebase.messaging();

async function enableNotification() {
  const token = await messaging.getToken({
    vapidKey: "eQX8Sqqx4VTFg0_hNp4qT_PKdyN2iipx8VLKIJA6oSo"
  });
  console.log("FCM Token:", token);
  alert("通知已啟用 ✅");
}

/* ================= EEW API ================= */

/**
 * ⚠️ 改成你的 EEW / 上一個地震 API
 * 例：
 * https://eew-3j0v.onrender.com/last
 */
const EEW_API_URL = "https://eew-3j0v.onrender.com/last";

async function fetchLastEarthquake() {
  try {
    const res = await fetch(EEW_API_URL);
    const data = await res.json();

    // 依你後端格式調整
    document.getElementById("loc").innerText = data.location;
    document.getElementById("mag").innerText = data.magnitude;
    document.getElementById("depth").innerText = data.depth + " km";
    document.getElementById("intensity").innerText = data.intensity + " 級";
    document.getElementById("time").innerText = data.time;

    document.getElementById("status").innerText = "● 已連線（上一個地震）";
  } catch (e) {
    document.getElementById("status").innerText = "● 連線失敗";
    console.error(e);
  }
}

// 每 10 秒更新一次
fetchLastEarthquake();
setInterval(fetchLastEarthquake, 10000);
</script>
</body>
